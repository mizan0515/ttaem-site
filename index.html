<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVA — 보고 싶은 순간을 바로 찾기</title>
<link rel="stylesheet" href="assets/app.css?v=7f9ee6ca6ffe">
</head>
<body class="hub-home">
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">CVA</a>
    <nav>
      <a href="index.html#streamers" class="active">스트리머</a>
      <a href="search.html">검색</a>
    </nav>
  </div>
</header>

<main class="wrap main">
  <section class="home-search" aria-labelledby="home-search-title">
    <h1 id="home-search-title">보고 싶은 순간을 바로 찾아보세요</h1>
    <form class="home-search-form" action="search.html" method="get">
      <div class="search-input-wrap">
        <input name="q" type="search" placeholder="방송 제목, 게임, 키워드 검색"
               autocomplete="off" aria-label="방송 요약 검색어">
      </div>
      <button type="submit">검색</button>
    </form>
    <p class="home-search-hint">스트리머를 몰라도 모든 방송 요약을 검색할 수 있습니다.</p>
  </section>

  <section class="summary-strip" id="kpi-hero" aria-label="공개 요약 현황">
    <div class="summary-stat"><span>스트리머</span><strong id="kpi-streamers">—</strong></div>
    <div class="summary-stat"><span>VOD 요약</span><strong id="kpi-vods">—</strong></div>
    <div class="summary-stat"><span>최근 갱신</span><strong id="kpi-updated">—</strong></div>
  </section>

  <section id="recent-section" hidden>
    <div class="section-head">
      <h2 class="section-title">최근 방송</h2>
      <span class="section-aside"><a href="search.html">전체 보기 <span aria-hidden="true">→</span></a></span>
    </div>
    <ul id="recent-strip" class="recent-strip"></ul>
  </section>

  <a id="storytimeline-section" class="storytimeline-link" href="storytimeline/">
    <strong>스토리 타임라인</strong>
    <span>게임·드라마·영화 이야기를 장면별로</span>
    <span class="storytimeline-link__action">전체 보기 <span aria-hidden="true">→</span></span>
  </a>

  <div class="section-head" id="streamers">
    <h2 class="section-title">스트리머</h2>
  </div>
  <ul id="streamer-list" class="streamer-grid"></ul>
  <div id="empty" class="empty" hidden>
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
      <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"></path>
    </svg>
    아직 공개된 스트리머가 없습니다.<br>
    <span class="empty-hint">관리자가 리포트를 발행하면 여기에 표시됩니다.</span>
  </div>
</main>

<script src="assets/app.js?v=4f3bca8e9149"></script>
<script>
window.ACG.renderStreamerIndex();
</script>
</body>
</html>
