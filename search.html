<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검색 — VOD 요약 허브</title>
<link rel="stylesheet" href="assets/app.css?v=4ac03e75d5a6">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">VOD 요약 허브</a>
    <nav>
      <a href="index.html">스트리머</a>
      <a href="search.html" class="active">검색</a>
    </nav>
  </div>
</header>

<main class="wrap main">
  <section class="search-hero">
    <h1 class="search-hero-title">검색</h1>
    <form class="search-form-big" id="search-form" onsubmit="return false;">
      <div class="search-input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="search-input" type="search"
               placeholder="스트리머 · 방송 제목 · 해시태그 · 타임라인 제목"
               autocomplete="off"
               aria-label="검색어">
      </div>
      <button id="search-button" type="submit">검색</button>
    </form>
    <p class="search-hint">
      예: 올림픽, 탬탬, 스노보드 · 대소문자 무시 · <kbd>/</kbd> 키로 어디서든 검색창 열기
    </p>
  </section>

  <p class="search-meta" id="search-meta"></p>
  <div class="streamer-filter" id="streamer-filter" hidden>
    <span class="streamer-filter-label">스트리머</span>
    <div class="streamer-filter-chips" id="streamer-filter-chips"></div>
  </div>
  <div class="search-discover" id="search-discover" hidden></div>
  <ul id="search-results" class="vod-list"></ul>
</main>

<script src="assets/app.js?v=93764a4c8a8f"></script>
<script>
window.ACG.renderSearch();
</script>
</body>
</html>
