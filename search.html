<!DOCTYPE html>

<body class="hub-search">
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">CVA</a>
    <nav>
      <a href="index.html#streamers">스트리머</a>
      <a href="search.html" class="active">검색</a>

<main class="wrap main">
  <section class="search-hero">
    <h1 class="search-hero-title">원하는 장면을 찾아보세요</h1>
    <form class="search-form-big" id="search-form" onsubmit="return false;">
      <div class="search-input-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="search-input" type="search"
               placeholder="방송 제목, 게임, 키워드 검색"
               autocomplete="off"
               aria-label="검색어">
      </div>
      <button id="search-button" type="submit">검색</button>
    </form>
    <p class="search-hint">
      방송 제목과 요약, 타임라인에 포함된 장면을 함께 검색합니다.
    </p>
  </section>

  <p class="search-meta" id="search-meta" aria-live="polite"></p>
  <div class="streamer-filter" id="streamer-filter" hidden>
    <span class="streamer-filter-label">스트리머</span>
    <div class="streamer-filter-chips" id="streamer-filter-chips"></div>
  </div>
  <div class="search-discover" id="search-discover" hidden></div>
