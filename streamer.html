<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트리머 다시보기 — VOD 요약 허브</title>
<link rel="stylesheet" href="assets/app.css?v=4568e0dcd448">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">VOD 요약 허브</a>
    <nav>
      <a href="index.html" class="active">스트리머</a>
      <a href="search.html">검색</a>
    </nav>
  </div>
</header>

<main class="wrap main">
  <a class="backlink" href="index.html">← 스트리머 목록</a>
  <header class="streamer-head">
    <h1 class="streamer-name" id="streamer-name">로딩 중...</h1>
    <p class="streamer-meta" id="streamer-meta"></p>
  </header>

  <section class="kpi-row" id="kpi-row" hidden>
    <div class="kpi-mini">
      <div class="kpi-mini-num" id="kpi-vod-count">—</div>
      <div class="kpi-mini-label">공개된 방송</div>
    </div>
    <div class="kpi-mini">
      <div class="kpi-mini-num" id="kpi-chat-total">—</div>
      <div class="kpi-mini-label">총 채팅 수</div>
    </div>
    <div class="kpi-mini">
      <div class="kpi-mini-num" id="kpi-last-vod">—</div>
      <div class="kpi-mini-label">최근 방송</div>
    </div>
  </section>

  <div class="list-controls" id="list-controls" hidden>
    <div class="list-controls-left">
      <div class="segmented" role="radiogroup" aria-label="정렬" id="sort-segmented">
        <button type="button" data-sort="newest" aria-pressed="true">최신순</button>
        <button type="button" data-sort="oldest" aria-pressed="false">오래된순</button>
        <button type="button" data-sort="longest" aria-pressed="false">긴 방송</button>
        <button type="button" data-sort="chats" aria-pressed="false">채팅 많은</button>
      </div>
    </div>
    <span class="list-controls-count" id="list-count"></span>
  </div>
  <div class="category-filter" id="category-filter" hidden>
    <span class="streamer-filter-label">카테고리</span>
    <div class="streamer-filter-chips" id="category-filter-chips"></div>
  </div>

  <ul id="vod-list" class="vod-list"></ul>
  <div id="empty" class="empty" hidden>
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
      <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"></path>
    </svg>
    이 스트리머의 공개된 방송 리포트가 아직 없습니다.
  </div>
</main>

<script src="assets/app.js?v=e91751c81758"></script>
<script>
window.ACG.renderStreamerDetail();
</script>
</body>
</html>
